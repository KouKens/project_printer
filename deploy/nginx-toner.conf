# /etc/nginx/sites-available/toner に置いて sites-enabled へ symlink する

server {
    listen 80;
    listen [::]:80;

    # 実際のホスト名に置き換える
    server_name toner.example.local;

    root /opt/toner/web;
    index index.html;

    # ビルド済みの静的ファイル。SPA なので実ファイルがなければ index.html を返す。
    # これがないと画面のリロードで 404 になる
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 開発時は Vite の proxy がこの役をしている。本番では nginx が担当する。
    # 末尾にパスを付けない proxy_pass なので /api/... がそのまま渡り、
    # NestJS 側の setGlobalPrefix('api') と噛み合う
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # プリンター登録は SNMP の応答待ちが入る。
        # 無応答の機器では v1 と v2c を順に試すため最大 10 秒かかる
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ビルド生成物はファイル名にハッシュが付くので長期キャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/toner.access.log;
    error_log  /var/log/nginx/toner.error.log;
}
